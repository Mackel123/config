[main]
include=/usr/share/foot/themes/nord
font=Maple Mono NF:style=Regular:size=11
term=xterm-256color
dpi-aware=no
pad=7x7
resize-delay-ms=100
initial-window-size-pixels=1080x700


[colors-dark]
alpha=0.5
cursor= a0aaa9 d9d9d9
foreground= d9d9d9
background = 313739

regular0= 484D59
regular1= F2E0D0
regular2= 728C14
regular3= F2EA77
regular4= 657136
regular5= 4F5953
regular6= f8f546
regular7= 0D0D0D

bright0= 484D59
bright1= F2E0D0
bright2= 728C14
bright3= F2EA77
bright4= 657136
bright5= 4F5953
bright6= f8f546
bright7= 0D0D0D

dim0= 484D59
dim1= F2E0D0
dim2= 728C14
dim3= F2EA77
dim4= 657136
dim5= 4F5953
dim6= f8f546
dim7= 0D0D0D

[scrollback]
lines=1000
multiplier=3.0

[url]
launch=firefox ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode
