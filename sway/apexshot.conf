# ApexShot Hotkeys for Sway/i3
# Add these lines to your sway config (e.g. ~/.config/sway/config)

bindsym SHIFT+SUPER+4 exec /usr/bin/apexshot capture area # capture_area
bindsym CTRL+ALT+X exec /usr/bin/apexshot capture crosshair # capture_crosshair
bindsym SHIFT+SUPER+3 exec /usr/bin/apexshot capture screen # capture_screen
bindsym CTRL+ALT+P exec /usr/bin/apexshot show-last-preview # show_last_preview
bindsym CTRL+ALT+R exec /usr/bin/apexshot record ui # open_recording_ui
bindsym CTRL+ALT+SHIFT+S exec /usr/bin/apexshot record stop # recording_stop_save
